name: Build DyKal APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.5'
          channel: 'stable'
          cache: true

      - name: Decode google-services.json (dari GitHub Secrets)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
            echo "✅ google-services.json terpasang"
          else
            echo "⚠️ GOOGLE_SERVICES_JSON_BASE64 belum di-set, build tetap jalan tapi Firebase tidak akan connect"
          fi

      - name: Setup Cloudinary & App Constants
        run: |
          # Ganti Cloud Name jika pakai secrets (opsional)
          if [ -n "${{ secrets.CLOUDINARY_CLOUD_NAME }}" ]; then
            sed -i "s/GANTI_DENGAN_CLOUD_NAME_KALIAN/${{ secrets.CLOUDINARY_CLOUD_NAME }}/g" lib/config/app_constants.dart || true
            echo "✅ Cloudinary cloud_name dari secrets"
          fi
          cat lib/config/app_constants.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (cek error, tapi tetap lanjut)
        run: flutter analyze || true

      - name: Build APK split per ABI (paling kecil)
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Build APK universal (single file)
        run: flutter build apk --release || true

      - name: List APK hasil
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK arm64 (paling sering dipakai)
        uses: actions/upload-artifact@v4
        with:
          name: dykal-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14

      - name: Upload APK universal
        uses: actions/upload-artifact@v4
        with:
          name: dykal-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: warn
