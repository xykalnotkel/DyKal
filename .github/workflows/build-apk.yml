name: Build DyKal APK

on:
  push:
    branches: [ main, master ]
    # Anti-boros CI: perubahan yang TIDAK menyentuh kode/aset app tidak usah
    # build APK (dokumentasi, file CI itu sendiri, worker cloudflare).
    paths-ignore:
      - '**.md'
      - 'cloudflare/**'
      - '.github/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'cloudflare/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter (pin 3.44.9)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # google-services.json sudah ter-commit (lihat .gitignore),
      # sehingga tidak perlu decode dari secret.

      - name: Cek secret keystore (wajib untuk signing rilis)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum di-set."
            echo "Tanpa keystore, build release GAGAL pada langkah signing (storeFile null)."
            echo "Set 4 secret: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS."
            echo "Panduan: lihat SETUP_GITHUB_ACTIONS.md."
            exit 1
          fi

      - name: Setup release keystore (dari GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/dykal-release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=dykal-release-key.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze (gagal hanya jika ada error; lint info/warning tidak memblokir)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK (split arm64 + armeabi)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm --android-skip-build-dependency-validation --dart-define=DYKAL_PUSH_KEY=${{ secrets.DYKAL_PUSH_KEY }}

      - name: List APK hasil
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK arm64
        uses: actions/upload-artifact@v4
        with:
          name: dykal-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14

      - name: Upload APK armeabi
        uses: actions/upload-artifact@v4
        with:
          name: dykal-apk-armeabi
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 14
