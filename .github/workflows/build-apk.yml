name: Build DyKal APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (pin 3.44.9)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'
          cache: true

      - name: Decode google-services.json (dari GitHub Secrets)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
            echo "google-services.json terpasang"
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 belum di-set, build tetap jalan tapi Firebase tidak akan connect"
          fi

      - name: Setup release keystore (dari GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/dykal-release-key.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=dykal-release-key.jks
          EOF
            echo "Keystore terpasang dari secret"
          else
            echo "KEYSTORE_BASE64 belum di-set - set secret agar release signing jalan"
          fi

      - name: Setup Cloudinary & App Constants
        run: |
          if [ -n "${{ secrets.CLOUDINARY_CLOUD_NAME }}" ]; then
            sed -i "s/GANTI_DENGAN_CLOUD_NAME_KALIAN/${{ secrets.CLOUDINARY_CLOUD_NAME }}/g" lib/config/app_constants.dart || true
            echo "Cloudinary cloud_name dari secrets"
          fi
          cat lib/config/app_constants.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze (cek error, tapi tetap lanjut)
        run: flutter analyze || true

      - name: Build APK universal (tanpa split)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm --android-skip-build-dependency-validation

      - name: List APK hasil
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK arm64
        uses: actions/upload-artifact@v4
        with:
          name: dykal-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14

      - name: Upload APK armeabi
        uses: actions/upload-artifact@v4
        with:
          name: dykal-apk-armeabi
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 14
