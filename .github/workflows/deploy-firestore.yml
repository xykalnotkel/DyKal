name: Deploy Firestore Rules

on:
  # Otomatis deploy tiap firestore.rules berubah di main (tidak perlu klik manual lagi)
  push:
    branches: [ main ]
    paths: [ firestore.rules ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # FIX 2026-08-11: w9jds/firebase-action@v13 sudah mati ("Unable to resolve
      # action") -> diganti firebase-tools resmi. Autentikasi pakai service account
      # dari secret FIREBASE_SERVICE_ACCOUNT (GOOGLE_APPLICATION_CREDENTIALS).
      - name: Siapkan kredensial service account
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT belum di-set di Settings repo -> Secrets -> Actions."
            exit 1
          fi
          echo "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"

      - name: Install Firebase CLI (official)
        run: npm install -g firebase-tools

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --project dykal-5e2b9 --non-interactive
