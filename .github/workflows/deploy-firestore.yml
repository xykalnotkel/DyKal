name: Deploy Firestore Rules

on:
  # Otomatis deploy tiap firestore.rules berubah di main (tidak perlu klik manual lagi)
  push:
    branches: [ main ]
    paths: [ firestore.rules ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # FIX 2026-08-11 (v2): w9jds/firebase-action@v13 mati, lalu firebase-tools
      # resmi kena 403 (SA tidak boleh akses serviceusage). Solusi final: deploy
      # lewat Rules REST API langsung (lihat .github/scripts/deploy_rules.py) —
      # jalan dengan izin bawaan SA firebase-adminsdk, tanpa perlu grant IAM.
      - name: Deploy Firestore Rules (Rules REST API)
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install --quiet google-auth requests
          python3 .github/scripts/deploy_rules.py firestore.rules dykal-5e2b9
