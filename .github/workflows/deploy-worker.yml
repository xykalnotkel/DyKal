name: Deploy Cloudflare Worker

on:
  # Otomatis deploy tiap ada perubahan worker di main
  push:
    branches: [ main ]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # wrangler 4.x butuh Node >=22

      # Sinkron 4 worker secret dari GitHub Secrets -> `wrangler secret put`
      # (idempotent, aman diulang). Butuh 1 secret buatan user: CLOUDFLARE_API_TOKEN
      # (dash.cloudflare.com -> My Profile -> API Tokens -> template "Edit Cloudflare Workers").
      - name: Cek CLOUDFLARE_API_TOKEN
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN belum di-set -> deploy worker DI-SKIP. Panduan: cloudflare/README.md"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # CATATAN: worker DyKal dikelola manual via API (PUT workers/scripts).
      # Sinkronisasi secret berbasis wrangler gagal ("latest version isn't
      # currently deployed") — dijadikan non-blokir agar tidak semu-memerahkan CI.
      - name: Sync worker secrets (FCM + push key)
        continue-on-error: true
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_CLIENT_EMAIL: ${{ secrets.FCM_CLIENT_EMAIL }}
          FCM_PRIVATE_KEY: ${{ secrets.FCM_PRIVATE_KEY }}
          DYKAL_PUSH_KEY: ${{ secrets.DYKAL_PUSH_KEY }}
        run: |
          set -e
          for V in FCM_PROJECT_ID FCM_CLIENT_EMAIL FCM_PRIVATE_KEY DYKAL_PUSH_KEY; do
            printenv "$V" | npx --yes wrangler@latest secret put "$V" --name dykal
            echo "secret $V tersinkron"
          done

      - name: Deploy worker
        continue-on-error: true
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest deploy
