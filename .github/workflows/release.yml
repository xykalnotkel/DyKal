name: Release DyKal APK

on:
  push:
    branches: [ main ]
    # Anti-boros CI: release hanya untuk perubahan kode/aset app.
    paths-ignore:
      - '**.md'
      - 'cloudflare/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'
          cache: true

      - name: Cek secret keystore (wajib untuk signing rilis)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum di-set."
            echo "Set 4 secret: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS."
            echo "Panduan: lihat SETUP_GITHUB_ACTIONS.md."
            exit 1
          fi

      - name: Decode keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KP: ${{ secrets.KEY_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS" | base64 --decode > android/app/dykal-release-key.jks
          printf "storePassword=$KSP\nkeyPassword=$KP\nkeyAlias=$KA\nstoreFile=dykal-release-key.jks\n" > android/key.properties

      - name: Pub get + icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build arm64 + armeabi
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm --android-skip-build-dependency-validation --dart-define=DYKAL_PUSH_KEY=${{ secrets.DYKAL_PUSH_KEY }}

      - name: Build universal (1 APK semua ABI)
        run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=DYKAL_PUSH_KEY=${{ secrets.DYKAL_PUSH_KEY }}

      - name: Rename
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk DyKal-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk DyKal-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-release.apk DyKal-universal.apk

      - name: Baca versi dari pubspec.yaml
        id: ver
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Generate changelog dari commit
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG..HEAD" | head -40)
          else
            NOTES=$(git log --pretty=format:"- %s" -20)
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: DyKal v${{ steps.ver.outputs.version }}
          body: |
            ## ADA UPDATE NIH!

            Versi baru DyKal v${{ steps.ver.outputs.version }} sudah rilis.
            Aplikasi akan menampilkan banner update otomatis; ketuk **Update Sekarang**
            untuk mengunduh dan memasang langsung di HP (progres terlihat di dalam aplikasi).

            ## Download APK
            - **DyKal-arm64.apk** = HP 64-bit (mayoritas HP modern)
            - **DyKal-armeabi-v7a.apk** = HP 32-bit
            - **DyKal-universal.apk** = satu file untuk semua HP (lebih besar ~1.5x;
              pilih ini kalau kena peringatan Play Protect di varian split)
            - Updater in-app mulai v1.1.8 **otomatis memilih varian sesuai ABI HP**,
              jadi pengguna tidak perlu menebak-nebak.

            ## Changelog
            ${{ steps.changelog.outputs.notes }}
          generate_release_notes: true
          update_release: true
          files: |
            DyKal-arm64.apk
            DyKal-armeabi-v7a.apk
            DyKal-universal.apk
          draft: false
          prerelease: false
