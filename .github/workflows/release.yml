name: Release DyKal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'
          cache: true

      - name: Decode google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: if [ -n "$GS" ]; then echo "$GS" | base64 --decode > android/app/google-services.json; fi

      - name: Decode keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KP: ${{ secrets.KEY_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 --decode > android/app/dykal-release-key.jks
            printf "storePassword=$KSP\nkeyPassword=$KP\nkeyAlias=$KA\nstoreFile=dykal-release-key.jks\n" > android/key.properties
          fi

      - name: Pub get + icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build arm64 + armeabi
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm --android-skip-build-dependency-validation

      - name: Rename
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk DyKal-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk DyKal-armeabi-v7a.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DyKal v1.0.${{ github.run_number }}
          body: |
            ## Download APK
            - **DyKal-armeabi-v7a.apk** = HP 32-bit
            - **DyKal-arm64.apk** = HP 64-bit
            
            Pilih sesuai HP. Kalau ragu coba armeabi dulu.
          files: |
            DyKal-arm64.apk
            DyKal-armeabi-v7a.apk
          draft: false
          prerelease: false
