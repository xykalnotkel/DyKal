name: dykal
description: DyKal - Aplikasi Private untuk Kamu & Dia. Chat, Album, Surat, Home & Call.
publish_to: 'none'
version: 1.3.0+13   # v1.3.0 (Batch G, spek v2): FCM data-only + notif MessagingStyle avatar/aksi di semua state, call_cancel stop dering, bar kembali ke panggilan, dering telepon sistem

environment:
  # SDK min dinaikkan ke 3.6.0: syarat firebase_core ^4.x (CI pakai Flutter 3.44.9, aman)
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- Firebase (Tanpa Storage, Tanpa App Check) ---
  # PENTING: langsung ke major terbaru. Kenapa bukan auth 4.x yang lebih baru?
  # Lockfile lama pin firebase_auth 4.16.0 (bug "PigeonUserDetails" cast saat
  # login/register). Tapi semua firebase_auth 4.x di atasnya (4.17-4.20) depend ke
  # auth_web dengan `web` <0.5.1 -> KONFLIK dengan just_audio ^0.10.4 (web ^1.0.0).
  # Versi 6.x sudah pakai web ^1.0.0 -> satu-satunya jalan bersih.
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_messaging: ^16.5.0

  # --- Cloudinary (Ganti Firebase Storage, NO CC) ---
  cloudinary_public: ^0.21.0
  dio: ^5.4.0
  http: ^1.1.2
  http_parser: ^4.0.2
  mime: ^1.0.4

  # --- Realtime & State ---
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # --- Call Audio/Video WebRTC ---
  flutter_webrtc: ^1.0.0 # upgrade: 0.9.48 pakai v1 embedding (Registrar) yang dihapus di Flutter 3.29+; 1.x sudah fix
  # Untuk filter/efek video: GPUImage / Banuba bisa ditambah nanti
  # Untuk screen share: flutter_webrtc sudah support getDisplayMedia

  # --- Voice Note ---
  record: ^6.1.1
  just_audio: ^0.10.4
  audio_waveforms: ^1.3.0
  permission_handler: ^11.1.0
  path_provider: ^2.1.1

  # --- UI Modern Seamless ---
  google_fonts: ^6.1.0 # Poppins & Plus Jakarta Sans
  cached_network_image: ^3.3.0
  photo_view: ^0.14.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_staggered_grid_view: ^0.7.0
  flutter_displaymode: ^0.6.0 # Support 60/90/120Hz
  animations: ^2.0.10

  # --- Utils ---
  intl: ^0.19.0
  uuid: ^4.2.1
  timeago: ^3.6.0
  image_picker: ^1.0.4
  flutter_image_compress: ^2.1.0 # Compress ke WebP otomatis
  shared_preferences: ^2.2.2 # simpan preferensi tema (dark/light)
  file_picker: ^8.0.0 # REAL package (sebelumnya dipake tapi gak ada di pubspec -> compile error di settings)
  package_info_plus: ^8.0.0 # baca versi app ASLI dari APK (biar user bisa verify versi di dalam app)
  image_cropper: ^8.0.0 # FIX profile: crop foto (shape bulat) sebelum upload
  flutter_foreground_task: ^10.0.0
  encrypt: ^5.0.0   # FIX stiker: AES-GCM (.webp.crypt15)
  cryptography: ^2.7.0 # E2EE media: ECDH X25519 (tukar kunci tanpa backend tahu)
  flutter_secure_storage: ^9.2.2 # E2EE: private key di Android Keystore
  connectivity_plus: ^6.0.5 # cek koneksi (popup no internet saat kirim)
  share_plus: ^10.0.0 # share foto dari album
  photo_manager: ^3.2.0 # custom gallery picker (album + image/video)
  flutter_local_notifications: ^19.5.0 # Notif ultah (fix #2329 build error, mulai 17.2.1)
  timezone: ^0.10.1 # (dinaikkan: dibutuhkan flutter_local_notifications ^19.5.0)
  swipe_to: ^1.0.2 # Swipe to reply
  scrollable_positioned_list: ^0.3.8
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/illustrations/webp/
    - assets/logo/
    - assets/icons/
    - assets/sounds/
    - assets/banners/
    - assets/backgrounds/
    - assets/badges/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/dykal_launcher.png"
  # SATU-SATUNYA master logo resmi (aturan owner 2026-08-11): dykal_launcher.png
  # (latar putih = versi "background default"). adaptive_foreground.png adalah
  # TURUNAN resminya (latar dicabut via flood-fill, konten di zona aman 64%).
  # Logo di dalam app memakai dykal_logo_transparent.png karena UI punya custom
  # background sendiri. Kit format lain (ICO/SVG/favicon/OG) ada di folder
  # branding/ — sengaja TIDAK dideklarasikan di sini agar tidak membundel APK.
  adaptive_icon_background: "#FFE9EE"
  adaptive_icon_foreground: "assets/logo/adaptive_foreground.png"
  min_sdk_android: 24
